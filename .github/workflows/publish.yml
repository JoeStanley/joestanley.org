# Publishing: the live site is built from the live branch, and only after every check passes.
# Claude never merges into live; a pull request into live is titled "For Joe:" and Joe merges it.
# Before the move, GitHub Pages is off for this repository and the live branch does not exist, so nothing runs.
name: publish
on:
  push:
    branches: [live]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      live: true
  build:
    needs: checks
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.141.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar xz -C "$HOME/.local/bin" hugo
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: "$HOME/.local/bin/hugo"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
