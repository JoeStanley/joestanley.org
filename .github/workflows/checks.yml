# The gate: every pull request, and every change to main, is checked against tests/SPEC.md.
# A pull request whose checks fail is not merged. publish.yml runs these same checks before anything goes live.
# V1 (screenshots against a baseline) is skipped here because screenshots depend on the machine that takes them;
# working sessions run it (see tests/SPEC.md, V1).
name: checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      live:
        description: "Publishing: also fail while any voice slot is open (spec X4)"
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the package-mirror fallback that setup relies on
        run: bash tests/test_apt_fallback.sh
      - name: Install what the checks need
        # setup.sh ends by printing the HUGO and CHROME lines. With pipefail, a setup that fails stops the run here
        # and shows why, where before its last line of output was read as those settings.
        run: |
          set -o pipefail
          bash tests/setup.sh | tee "$RUNNER_TEMP/setup.out"
          tail -n 1 "$RUNNER_TEMP/setup.out" | sed 's/^export //' | tr ' ' '\n' >> "$GITHUB_ENV"
      - name: Check the site against tests/SPEC.md
        # publish.yml calls this workflow with live: true, so a passage still waiting for Joe's voice (X4) stops it.
        run: python3 tests/check_site.py --skip V1 ${{ inputs.live && '--live' || '' }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: tests/report.md
