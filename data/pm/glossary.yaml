# Shared glossary. One entry per term, defined once for the whole syllabus.
# Use a term in any unit with: {{< pm/term "constraint" >}} or {{< pm/term "constraint" "constraints" >}}
# Add a term only when a unit uses it.
constraint:
  term: Constraint
  also: bottleneck
  text: The one part of a system that limits what the whole system can deliver.
wip:
  term: Work in progress
  also: WIP
  text: Work that has been started and not finished. A long queue of it in front of one step is the usual sign of a constraint.
okr:
  term: OKRs
  show: OKRs
  also: objectives and key results
  text: A goal-setting format many teams use. Each objective is paired with a few measurable key results.
stock:
  term: Stock
  text: Anything that builds up or drains away and can be counted or measured at one moment, such as a backlog or a bank balance. Only the flows into and out of it change it.
feedback-loop:
  term: Feedback loop
  text: A chain of cause and effect that runs from the level of a stock back to one of its flows. A balancing loop pulls the stock toward a goal. A reinforcing loop pushes it further the way it is already going.
leverage-point:
  term: Leverage point
  text: A place in a system where a small change can produce a large change in how the whole behaves. Donella Meadows ranked twelve of them.
heavyweight:
  term: Heavyweight product manager
  show: heavyweight
  text: From a study of car development. A lightweight product manager coordinates the work. A heavyweight also champions the product's concept, what you'd call its vision, and answers for it.
conceptual-integrity:
  term: Conceptual integrity
  text: Fred Brooks's name for a product that reflects one set of design ideas, so its parts belong together.
job-crafting:
  term: Job crafting
  text: Reshaping your own job from the inside, by changing its tasks, your working relationships or how you see its purpose. Amy Wrzesniewski and Jane Dutton named it in 2001.
glue-work:
  term: Glue work
  text: Tanya Reilly's name for the work that holds a team together and rarely shows on a roadmap.
inverse-conway:
  term: Inverse Conway maneuver
  text: Shaping teams, and how they talk to each other, on purpose, to get the system you want.
interface:
  term: Interface
  text: Where two parts of a system, or two teams, meet, and what each side promises the other there.
access-pattern:
  term: Access pattern
  text: A question a system's data has to answer, with who asks it, how often, how fast and how fresh.
operational-analytical:
  term: Operational and analytical
  text: Operational use keeps the live service running, and analytical use looks across many records, the way reports do.
system-of-record:
  term: System of record and system of reference
  text: A system of record holds the authoritative copy of some data, from which every other copy is made. A system of reference makes that data easy to use, by gathering or preparing copies for people to read and decide with, and isn't where it changes.
bounded-context:
  term: Bounded context
  text: An area of a business or a system inside which each word and model has one agreed meaning.
event-time:
  term: Event time and processing time
  text: When something happened, and when the system saw it.
pace-layers:
  term: Pace layers
  text: Parts of a building, a society or a product that change at different speeds, with the slow ones setting the terms for the fast. Stewart Brand's shearing layers are a building's version.
cost-of-change:
  term: Cost of change
  text: What it takes to change part of a product later, set mostly by the slowest layer the change touches.
coupling:
  term: Coupling
  text: How far a change to one part forces a change to another, judged for a particular change.
complexity:
  term: Complexity
  text: In John Ousterhout's sense, anything in a system's structure that makes it hard to understand and change. Its symptoms are change amplification, cognitive load and unknown unknowns.
cognitive-load:
  term: Cognitive load
  text: How much someone has to know to make a change safely.
