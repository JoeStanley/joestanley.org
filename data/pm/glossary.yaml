# Shared glossary. One entry per term, defined once for the whole syllabus.
# Use a term in any unit with: {{< pm/term "constraint" >}} or {{< pm/term "constraint" "constraints" >}}
# Add a term only when a unit uses it.
constraint:
  term: Constraint
  also: bottleneck
  text: The one part of a system that limits what the whole system can deliver.
wip:
  term: Work in progress
  also: WIP
  text: Work that has been started and not finished. A long queue of it in front of one step is the usual sign of a constraint.
okr:
  term: OKRs
  show: OKRs
  also: objectives and key results
  text: A goal-setting format many teams use. Each objective is paired with a few measurable key results.
stock:
  term: Stock
  text: Anything that builds up or drains away and can be counted or measured at one moment, such as a backlog or a bank balance. Only the flows into and out of it change it.
feedback-loop:
  term: Feedback loop
  text: A chain of cause and effect that runs from the level of a stock back to one of its flows. A balancing loop pulls the stock toward a goal. A reinforcing loop pushes it further the way it is already going.
leverage-point:
  term: Leverage point
  text: A place in a system where a small change can produce a large change in how the whole behaves. Donella Meadows ranked twelve of them.
heavyweight:
  term: Heavyweight product manager
  show: heavyweight
  text: From a study of car development. A lightweight product manager coordinates the work. A heavyweight also champions the product's concept, what you'd call its vision, and answers for it.
conceptual-integrity:
  term: Conceptual integrity
  text: Fred Brooks's name for a product that reflects one set of design ideas, so its parts belong together.
job-crafting:
  term: Job crafting
  text: Reshaping your own job from the inside, by changing its tasks, your working relationships or how you see its purpose. Amy Wrzesniewski and Jane Dutton named it in 2001.
glue-work:
  term: Glue work
  text: Tanya Reilly's name for the work that holds a team together and rarely shows on a roadmap.
discovery:
  term: Discovery
  text: The work of learning whether a problem is real, whose it is and what solving it is worth, before and while you build.
cost-of-delay:
  term: Cost of delay
  text: What a week of waiting costs, in the value you don't get while the work isn't done. It puts urgency and value in one number.
inverse-conway:
  term: Inverse Conway maneuver
  text: Shaping teams, and how they talk to each other, on purpose, to get the system you want.
interface:
  term: Interface
  text: Where two parts of a system, or two teams, meet, and what each side promises the other there.
access-pattern:
  term: Access pattern
  text: A question a system's data has to answer, with who asks it, how often, how fast and how fresh.
operational-analytical:
  term: Operational and analytical
  text: Operational use keeps the live service running, and analytical use looks across many records, the way reports do.
system-of-record:
  term: System of record
  text: The system that holds the authoritative copy of some data, from which every other copy is made.
bounded-context:
  term: Bounded context
  text: An area of a business or a system inside which each word and model has one agreed meaning.
event-time:
  term: Event time and processing time
  text: When something happened, and when the system saw it.
pace-layers:
  term: Pace layers
  text: Parts of a building, a society or a product that change at different speeds, with the slow ones setting the terms for the fast. Stewart Brand's shearing layers are a building's version.
cost-of-change:
  term: Cost of change
  text: What it takes to change part of a product later, set mostly by the slowest layer the change touches.
coupling:
  term: Coupling
  text: How far a change to one part forces a change to another, judged for a particular change.
complexity:
  term: Complexity
  text: In John Ousterhout's sense, anything in a system's structure that makes it hard to understand and change. Its symptoms are change amplification, cognitive load and unknown unknowns.
cognitive-load:
  term: Cognitive load
  text: How much someone has to know to make a change safely.
percentile:
  term: Percentile
  text: Where a case falls when all of them are ranked. If the 99th percentile wait is 3 seconds, 99 in 100 wait 3 seconds or less.
slo:
  term: Service level objective
  also: SLO
  text: A reliability target for a service, such as "up 99.9 percent of the time," agreed before anything goes wrong.
error-budget:
  term: Error budget
  text: The amount of failure a service's SLO allows, treated as a budget. While some is left, releases go ahead.
feature-toggle:
  term: Feature toggle
  also: feature flag
  text: A switch in the software that turns a feature on or off without changing the code.
guardrail-metric:
  term: Guardrail metric
  text: A measure that must not get worse while you try to move another. You agree in advance the level at which you'd stop.
data-informed:
  term: Data-informed
  text: Using numbers and stories for what each can tell you, while the decision stays yours. Adam Mosseri set it against being data-driven in a 2010 talk.
mcnamara-fallacy:
  term: McNamara fallacy
  text: Taking what's easy to measure for all that matters. The market researcher Daniel Yankelovich named it in 1971.
intersectional:
  term: Intersectional
  text: Looking at where two or more groups overlap, such as gender and skin type together, not at one at a time. Kimberlé Crenshaw named the idea in 1989.
regression-to-the-mean:
  term: Regression to the mean
  text: An extreme result tends to be followed by a less extreme one, whatever you did in between.
one-way-doors:
  term: One-way and two-way doors
  text: Jeff Bezos's terms for decisions you can't easily undo, and decisions you can.
straddling:
  term: Straddling
  text: Michael Porter's word for trying to hold two positions that don't fit together, such as a full-service airline copying a low-cost rival.
ooda-loop:
  term: OODA loop
  also: observe, orient, decide, act
  text: John Boyd's model of every decision as a loop. He held that orienting, the picture you act from, matters most.
commanders-intent:
  term: Commander's intent
  text: The why given with a task, so people can still act when the task goes stale. From military doctrine.
kernel-of-a-strategy:
  term: Kernel of a strategy
  text: "Richard Rumelt's name for the three parts a strategy needs: a diagnosis of what's going on, a guiding policy for meeting it, and coherent actions that carry it out."
decision-record:
  term: Decision record
  text: A short note of one significant decision, with its context, the decision, its status and its consequences. Engineers call it an architecture decision record (ADR).
advice-process:
  term: Advice process
  text: Anyone may make a decision, after asking the people it affects and people with relevant expertise. They don't have to follow the advice, but they have to seek it out and write it down.
consequence-scanning:
  term: Consequence scanning
  text: A short team conversation, early in a product's or a feature's life, about everything it could cause, run on three questions from Doteveryone.
problem-of-many-hands:
  term: Problem of many hands
  text: Dennis Thompson's name for harm that comes from so many small contributions that it's hard to say who's responsible.
moral-justification:
  term: Moral justification
  text: Albert Bandura's name for making harm feel acceptable by casting it as serving a worthy or moral purpose, such as a company's mission.
right-to-erasure:
  term: Right to erasure
  text: A person's right, under the General Data Protection Regulation (GDPR) in the EU and the UK, to ask an organization to delete their personal data, in some circumstances.
ladder-of-inference:
  term: Ladder of inference
  text: Chris Argyris's model of how you climb from what you notice to what you conclude and do, usually without seeing the steps.
double-loop-learning:
  term: Double-loop learning
  text: Questioning a goal and the assumptions behind it, where single-loop learning only changes the actions that serve it.
psychological-safety:
  term: Psychological safety
  text: A shared belief that it's safe to take interpersonal risks at work, such as raising a concern or admitting a mistake. Amy Edmondson's research on teams made the idea widely known.
premortem:
  term: Premortem
  text: Gary Klein's technique of telling a team its project has already failed and asking each person, alone, to write down why.
left-hand-column:
  term: Left-hand column
  text: An exercise from Chris Argyris and Donald Schön. Beside what was said in a conversation, you write what you thought and felt but didn't say.
trust-equation:
  term: Trust equation
  text: A consultants' model that treats trust as credibility, reliability and intimacy, divided by self-orientation.
scr:
  term: SCR
  also: situation, complication, resolution
  text: A three-part opening for a message. The situation is what the reader already accepts, the complication is what changed, and the resolution is what you recommend or ask. It adapts Barbara Minto's situation, complication and question.
stress-position:
  term: Stress position
  text: The end of a sentence, which readers naturally emphasize, so it's the place for what you most want noticed. The term is Gopen and Swan's.
