# The course's arc, in four parts, then the closing unit (spec S20, the owner's pick of 22 November 2026, card
# v1-start). Start lists the modules part by part, each part's name and line in the small label type above its
# modules (the owner's pick, 23 November 2026), and The Compass groups every module's question the same way.
# Every module on the map (modules.yaml) sits in exactly one part, in reading order.
parts:
  - title: Your job and who it's for
    line: What the job is, and whose problem you're solving.
    modules: [own-your-role, know-who-its-for]
  - title: How the system works
    line: Our role requires change, which means we first need to understand why things are the way they are if we have any hope of changing them for the better.
    modules: [see-the-system, find-the-constraint, mind-the-seams, map-the-domain, design-for-change, change-safely]
  - title: How you decide
    line: Once we understand how and why to change things, we need to decide what to change. And, most importantly, to accept responsibility for the implications of those decisions in an intentional way.
    modules: [weigh-the-evidence, decide-and-set-direction, answer-for-what-you-build]
  - title: How you learn and lead
    line: Having the right answer doesn't matter if you can't convince people of it. This comes in part from in-the-moment persuasion, and more from having already built a reputation for credibility. This part focuses on the latter.
    modules: [notice-when-you-are-wrong, bring-people-with-you]
# The closing unit (spec S21): its page under content/pm/, and its line on Start.
closing:
  label: In closing
  page: the-compass
  line: Every question in one place, one call walked through several of them, and where to go from here in your learning journey.
