# The twelve modules, in reading order. One entry per stop on the map (spec X1).
# A module is either built or a draft, never both:
#   page:  the content file under content/pm/, once the module is rebuilt for the site.
#   draft: the file under drafts/pm/ that holds the module and its cards until then. "state" says where it stands.
# The working doc's tabs are made from this list (tools-pm/source-doc.py).
- id: own-your-role
  num: 0
  title: Own Your Role
  question: How do you grow your role beyond what you were handed, and make the product's vision your own?
  page: own-your-role
- id: see-the-system
  num: 1
  title: See the System
  question: What's the system, and why does it behave this way?
  page: see-the-system
- id: find-the-constraint
  num: 2
  title: Find the Constraint
  question: Where is the work actually stuck, and are we measuring the right thing?
  page: find-the-constraint
- id: mind-the-seams
  num: 3
  title: Mind the Seams
  question: How does the way we're organized shape what we build?
  page: mind-the-seams
- id: map-the-domain
  num: 4
  title: Map the Domain
  question: What questions must the system answer, how fast and how fresh, and where should its boundaries fall?
  page: map-the-domain
- id: design-for-change
  num: 5
  title: Design for Change
  question: What will change, how fast, and what should be easy to change?
  page: design-for-change
- id: change-safely
  num: 6
  title: Change Safely
  question: How good does it have to be, and how do we change it quickly when mistakes are expensive?
  draft: change-safely
  state: First draft of 19 November 2026, winnowed on 21 November into the pilot's parts, with one card, Error Budgets, sourced to Google's example error budget policy. Guardrail Metrics, How Complex Systems Fail and Models That Are Sometimes Wrong were cut as cards, each kept as a term, a question or a full-path source.
- id: weigh-the-evidence
  num: 7
  title: Weigh the Evidence
  question: What do the numbers and the stories each tell you, and how much should either decide?
  draft: weigh-the-evidence
  state: First draft of 20 November 2026, winnowed on 21 November into the pilot's parts. It carries two cards. Joe kept The Law of Small Numbers on 21 November, and The McNamara Fallacy goes at the rebuild. Munro's review, Budiu and Chen moved to the full path.
- id: decide-and-set-direction
  num: 8
  title: Decide and Set Direction
  question: Which decisions matter, whose are they, and what are we choosing not to do?
  draft: decide-and-set-direction
  state: Draft of 17 November 2026, winnowed on 21 November into the pilot's parts, with one card, Agency and Coherence. Strategy as Forsaking, Last Responsible Moment and Chesterton's Fence were cut as cards, their ideas kept in Why this matters, the Do and the full path. Bezos, Harmel-Law and Rumelt replace the deck pages, still to be opened.
- id: answer-for-what-you-build
  num: 9
  title: Answer for What You Build
  question: Who benefits and who is harmed by what we build, and what's our share of the responsibility?
  draft: answer-for-what-you-build
  state: First draft of 19 November 2026, winnowed on 21 November into the pilot's parts, with one card, Many Hands. Value Created, Value Captured, Collect Less and Consequence Scanning were cut as cards, their ideas carried by Doteveryone's own page, Reichheld and Markey in place of Doctorow, Schneier, the Do and the Check.
- id: notice-when-you-are-wrong
  num: 10
  title: Notice When You Are Wrong
  question: How do we find out we are wrong?
  draft: notice-when-you-are-wrong
  state: Draft of 17 November 2026, winnowed on 21 November into the pilot's parts, with one card, Double-Loop Learning. Batista and Edmondson replace six deck readings, a premortem is the main exercise, and the deck is no longer cited.
- id: bring-people-with-you
  num: 11
  title: Bring People With You
  question: How do you earn the trust of the people who decide and depend on you, and keep it when there is nothing to report?
  draft: bring-people-with-you
  state: First draft of 19 November 2026, winnowed on 21 November into the pilot's parts. It carries two cards. Joe kept The Trust Equation on 21 November, and SCR goes at the rebuild. Two Kinds of Update folded into the text, the Do and the one thing, and Fractal Storytelling became the optional exercise.
