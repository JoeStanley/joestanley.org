last-time: ""

# Why this matters
why-this-matters:
  - beside: "choosing what not to do"
    note: "If you retain nothing else about what a strategy is, remember this."
  - beside: "G. K. Chesterton made the point"
    note: "I first learned about Chesterton's Fence through experience in public policy and legislative advocacy. Anytime an answer seems obvious in a complex situation, there's usually a very good reason it hasn't happened yet. Learn why."
  - beside: "Then ask whose decision it is"
    at: "foot"
    note: "The best delivery teams work when the lines of accountability are clear but the expertise blurred."

