# Margin notes for Module 0, Own Your Role.
# One slot per part of the page, in reading order. Write a note between the quotes; leave "" for none.
# On a wide screen, and in a module's print, a note shows in your hand in the margin beside its part. On a phone,
# and in print on Start, a card or the glossary, it sits in the text under its part's heading, in your hand too.
# Wherever it sits in the text, it opens with "Sidenote:", and a screen reader always reads that word first.
# A note beside a source on the full path may run on past it. Markdown works for **bold** and [a link](https://example.org).
# To put a note beside one paragraph of a part, give the slot a list, and name the paragraph by a few of its words:
#   why-this-matters:
#     - beside: "Two versions of the job"
#       note: "Your note."
# It sits level with the top of that paragraph; add  at: foot  to sit it level with the paragraph's foot.
# Keep the slot names as they are. After a unit changes, run tools-pm/margin-slots.py to add new slots;
# it keeps every note already written.

# Beside the title
top: ""

# Why this matters
why-this-matters:
  - beside: "So take the job as described first"
    at: "foot"
    note: "As I've sat in performance calibrations and promotion panels over the years, this is one of the main signals a junior PM can give that they are ready for growth. The biggest risk is overconfidence: Shaping a job toward the wrong priorities (such as glue work) too early due to ignorance."
  - beside: "You'll do plenty of both"
    note: "The product vision is not only the end experience. It's also the people, process, and technology that make it. You're shaping a way of how people work together, spending hundreds to millions of hours, to create something that will touch the lives of people you'll likely never meet. There's a profound privilege and responsibility there.\n\nDon't shrink from it."
  - beside: "The vision has to be yours, too"
    at: "foot"
    note: "I work in enterprise-tier financial platform design, some of the most standardized and invisible stuff imaginable. If I can find ways for my own voice to come through in the work, anyone reading this can."
  - beside: "The vision has to be yours, too"
    note: "Played by the incomparable Bernadette Peters"
  - beside: "Now with all this said"
    at: "foot"
    note: "Do it well, and you'll make a symphony."

