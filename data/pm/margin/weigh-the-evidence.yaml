    note: "In the traditional SV tech sector especially, there's a cultural bias toward quantitative metrics and an undeserved superiority complex on the part of quants.\n\nNever forget that quantitative data is essentially qualitative data that has been coded (be it in the assumptions of the instrument designers, or more literally), and even together they always tell an incomplete story."

