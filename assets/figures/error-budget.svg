<svg class="fig" viewBox="0 0 360 214" role="img" aria-labelledby="fig-eb-title fig-eb-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-eb-title">A month of uptime, and the error budget at its end.</title>
  <desc id="fig-eb-desc">Two bars, each one month. In the first, nearly all of the bar is uptime, and a slice at the end is the budget. Two incidents have used part of it, and what is left is highlighted: some budget left, so releases go ahead. In the second, incidents fill the whole slice: budget spent, so releases slow or stop. Not to scale: the budget is about 43 minutes a month.</desc>

  <text class="fig-label" x="12" y="18">Some budget left</text>
  <text class="fig-note" x="12" y="33">releases go ahead</text>
  <text class="fig-label" x="348" y="33" text-anchor="end">The budget</text>
  <rect class="fig-pipe" x="12" y="42" width="336" height="34"/>
  <text class="fig-item" x="150" y="63.5" text-anchor="middle">Uptime</text>
  <rect class="fig-mark" x="311" y="42.75" width="36.25" height="32.5"/>
  <rect class="fig-loss" x="288" y="42.75" width="12" height="32.5"/>
  <rect class="fig-loss" x="300" y="42.75" width="11" height="32.5"/>
  <path class="fig-axis" d="M288,82 L288,85 L311,85 L311,82 M299.5,85 L299.5,91"/>
  <text class="fig-note" x="299.5" y="105" text-anchor="middle">Incidents</text>

  <text class="fig-label" x="12" y="128">Budget spent</text>
  <text class="fig-note" x="12" y="143">releases slow or stop</text>
  <rect class="fig-pipe" x="12" y="152" width="336" height="34"/>
  <text class="fig-item" x="150" y="173.5" text-anchor="middle">Uptime</text>
  <rect class="fig-loss" x="288" y="152.75" width="59.25" height="32.5"/>

  <text class="fig-note" x="12" y="206">Not to scale: the budget is about 43 minutes a month</text>
</svg>
