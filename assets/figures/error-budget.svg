<svg class="fig" viewBox="0 0 360 218" role="img" aria-labelledby="fig-eb-title fig-eb-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-eb-title">A month of uptime, and the error budget at its end.</title>
  <desc id="fig-eb-desc">Two bars, each one month. In the first, nearly all of the bar is uptime, and a slice at the end is the budget. Two incidents have used part of it, and what is left is highlighted: some budget left, so releases go ahead. In the second, incidents fill the whole slice: budget spent, so releases slow or stop. Not to scale: a target of 99.9 percent leaves about 43 minutes a month.</desc>

  <text class="fig-label" x="12" y="18">Some budget left</text>
  <text class="fig-note" x="12" y="33">releases go ahead</text>
  <text class="fig-label" x="348" y="29" text-anchor="end">The budget</text>
  <path class="fig-guide" d="M288,39 L288,35 L348,35 L348,39"/>
  <rect class="fig-pipe" x="12" y="44" width="336" height="34"/>
  <text class="fig-item" x="150" y="65.5" text-anchor="middle">Uptime</text>
  <rect class="fig-mark" x="311" y="44.75" width="36.25" height="32.5"/>
  <text class="fig-label fig-on-mark" x="329" y="65.5" text-anchor="middle">left</text>
  <rect class="fig-loss" x="288" y="44.75" width="12" height="32.5"/>
  <rect class="fig-loss" x="300" y="44.75" width="11" height="32.5"/>
  <path class="fig-guide" d="M288,83 L288,87 L311,87 L311,83 M299.5,87 L299.5,93"/>
  <text class="fig-item" x="299.5" y="107" text-anchor="middle">Incidents</text>

  <text class="fig-label" x="12" y="132">Budget spent</text>
  <text class="fig-note" x="12" y="147">releases slow or stop</text>
  <rect class="fig-pipe" x="12" y="156" width="336" height="34"/>
  <text class="fig-item" x="150" y="177.5" text-anchor="middle">Uptime</text>
  <rect class="fig-loss" x="288" y="156.75" width="12" height="32.5"/>
  <rect class="fig-loss" x="300" y="156.75" width="11" height="32.5"/>
  <rect class="fig-loss" x="311" y="156.75" width="14" height="32.5"/>
  <rect class="fig-loss" x="325" y="156.75" width="10" height="32.5"/>
  <rect class="fig-loss" x="335" y="156.75" width="12.25" height="32.5"/>

  <text class="fig-note" x="12" y="210">Not to scale: 99.9% leaves about 43 minutes a month</text>
</svg>
