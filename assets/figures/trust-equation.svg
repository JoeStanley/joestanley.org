<svg class="fig" viewBox="0 0 360 150" role="img" aria-labelledby="fig-trust-title fig-trust-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-trust-title">The trust equation as a fraction: three parts on top, self-orientation below.</title>
  <desc id="fig-trust-desc">Trust equals a fraction. On top, added together: credibility, what you say; reliability, what you do; and intimacy, how safe it is to be vulnerable with you. Below the line, highlighted: self-orientation, where your focus sits. The more of it, the less trust all three add up to.</desc>

  <text class="fig-label" x="12" y="86.5">Trust =</text>
  <g class="fig-note" text-anchor="middle">
    <text x="114" y="40">what you say</text><text x="207" y="40">what you do</text><text x="297" y="26">safe to be</text><text x="297" y="40">vulnerable</text>
  </g>
  <g class="fig-label" text-anchor="middle">
    <text x="114" y="62">Credibility</text><text x="161" y="62">+</text><text x="207" y="62">Reliability</text><text x="254" y="62">+</text><text x="297" y="62">Intimacy</text>
  </g>
  <path class="fig-line" d="M72,82 L338,82"/>
  <rect class="fig-mark" x="146" y="95" width="118" height="20"/>
  <text class="fig-label fig-on-mark" x="205" y="109.5" text-anchor="middle">Self-orientation</text>
  <text class="fig-note" x="205" y="134" text-anchor="middle">where your focus sits</text>
</svg>
