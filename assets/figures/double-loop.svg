<svg class="fig" viewBox="0 0 360 230" role="img" aria-labelledby="fig-loops-title fig-loops-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-loops-title">Two loops back from one result: a small one to the action, a larger one to the goal.</title>
  <desc id="fig-loops-desc">Three stops in a row, left to right: the goal, a thermostat set at 68 degrees; the action, heat on; and the result, how warm the room is. A small loop runs from the result back to the action: single-loop learning fixes the action and keeps the goal. A larger loop runs from the result back under the action to the goal, which is highlighted: double-loop learning asks whether the goal is right.</desc>

  <!-- the goal, the action and the result -->
  <rect class="fig-mark" x="40" y="68" width="28" height="28"/>
  <path class="fig-axis" d="M62,82 L162,82"/>
  <path class="fig-arrow" d="M160,77 L169,82 L160,87 Z"/>
  <path class="fig-axis" d="M188,82 L288,82"/>
  <path class="fig-arrow" d="M286,77 L295,82 L286,87 Z"/>
  <g class="fig-stops">
    <circle cx="54" cy="82" r="7"/>
    <circle cx="180" cy="82" r="7"/>
    <circle cx="306" cy="82" r="7"/>
  </g>
  <g class="fig-label" text-anchor="middle">
    <text x="54" y="44">Goal</text><text x="180" y="44">Action</text><text x="306" y="44">Result</text>
  </g>
  <g class="fig-note" text-anchor="middle">
    <text x="54" y="58">68 degrees</text><text x="180" y="58">Heat on</text><text x="306" y="58">How warm it is</text>
  </g>

  <!-- the single loop, back to the action -->
  <path class="fig-return" d="M302,94 C294,132 196,132 184,100"/>
  <path class="fig-arrow" d="M178,103 L182.5,92 L190,101 Z"/>
  <text class="fig-label" x="236" y="136" text-anchor="middle">Single loop</text>
  <text class="fig-note" x="236" y="150" text-anchor="middle">fix the action</text>

  <!-- the double loop, back to the goal -->
  <path class="fig-return" d="M312,94 C322,214 64,214 56,100"/>
  <path class="fig-arrow" d="M50,103 L54.5,92 L62,101 Z"/>
  <text class="fig-label" x="184" y="206" text-anchor="middle">Double loop</text>
  <text class="fig-note" x="184" y="220" text-anchor="middle">is this the right goal?</text>
</svg>
