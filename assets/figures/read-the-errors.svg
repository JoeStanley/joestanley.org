<svg class="fig" viewBox="0 0 360 240" role="img" aria-labelledby="fig-err-title fig-err-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-err-title">A sample of a bot score's calls, both ways, and its mistakes sorted by kind.</title>
  <desc id="fig-err-desc">Checking a bot score on ticket orders: 50 of each call, though far more orders get through than are held. On the left, two grids of 50 squares. Of 50 orders it held back, 15 are shaded: its mistakes. Of 50 it let through, 4 are shaded. On the right, the 19 mistakes sorted into kinds, as bars: fans who bought for a group, 9; bots it let through, 4, which may cost more; fans on a shared network, 4; something else, 2. Under the longest bar, highlighted: test for this first.</desc>

