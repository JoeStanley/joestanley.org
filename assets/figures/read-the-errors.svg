<svg class="fig" viewBox="0 0 360 194" role="img" aria-labelledby="fig-err-title fig-err-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-err-title">A sample of a bot score's calls, both ways, and its mistakes sorted by kind.</title>
  <desc id="fig-err-desc">On a ticketing app, a model scores each order for how likely it is to be a bot. Read a sample of its calls both ways: of 50 orders it held back, 35 were bots and 15 were real fans held by mistake; of 50 it let through, 46 were fans and 4 were bots it missed. Sorted by what went wrong, its 19 mistakes fall into four kinds: 9 fans who bought for a group on one card, 4 bots it let through, 4 fans who shared a network, such as a campus, and 2 others. The biggest kind is marked. Test for the biggest or the costliest kind first.</desc>

