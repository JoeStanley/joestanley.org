<svg class="fig" viewBox="0 0 360 240" role="img" aria-labelledby="fig-err-title fig-err-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-err-title">A sample of a bot score's calls, both ways, and its mistakes sorted by kind.</title>
  <desc id="fig-err-desc">On the left, two grids of 50 squares, a sample of ticket orders. Of 50 orders a bot score held back, 15 are shaded: its mistakes. Of 50 it let through, 4 are shaded. On the right, the 19 mistakes sorted into kinds, as bars: fans who bought for a group, 9; bots it let through, 4; fans on a shared network, 4; something else, 2. Under the longest bar, highlighted: test for this first, or for the costliest kind.</desc>

  <text class="fig-label" x="12" y="18">Orders held back</text>
  <text class="fig-note" x="12" y="33">15 of 50 were mistakes</text>
  <text class="fig-label" x="12" y="122">Orders let through</text>
  <text class="fig-note" x="12" y="137">4 of 50 were mistakes</text>
