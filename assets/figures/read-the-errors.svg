<svg class="fig" viewBox="0 0 360 244" role="img" aria-labelledby="fig-err-title fig-err-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-err-title">A sample of a bot score's calls, both ways, and its mistakes sorted by kind.</title>
  <desc id="fig-err-desc">Checking a bot score on ticket orders, from a sample of 50 orders each way. On the left, two grids of 50 squares. Of 50 orders it held back, 15 are shaded: its mistakes. Of 50 it let through, 4 are shaded. On the right, the mistakes by kind. The 15 fans it held back, as bars: 9 bought for a group, with a highlighted label, biggest of these; 4 were on a shared network; 2 were something else. Then the 4 bots it let through, with no bar: they stand for far more orders, so weigh them by cost, not count.</desc>

