<svg class="fig" viewBox="0 0 360 243" role="img" aria-labelledby="fig-err-title fig-err-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-err-title">A sample of a bot score's calls, both ways, and its mistakes sorted by kind.</title>
  <desc id="fig-err-desc">Checking a bot score on ticket orders, from a sample of 50 of each call. On the left, two grids of 50 squares. Of 50 orders it held back, 15 are shaded: its mistakes. Of 50 it let through, 4 are shaded. On the right, the 19 mistakes sorted into kinds, as bars. First the fans it held back: fans who bought for a group, 9, with a highlighted label, test for this first; fans on a shared network, 4; other fans, 2. Then, under a rule, the bots it let through: 4, of far more orders.</desc>

  <text class="fig-label" x="12" y="18">Checking a bot score on ticket orders</text>
  <text class="fig-note" x="12" y="33">a sample: 50 of each call</text>
  <text class="fig-label" x="12" y="58">Held back</text>
  <text class="fig-note" x="12" y="73">15 of 50 were mistakes</text>
  <text class="fig-label" x="12" y="158">Let through</text>
  <text class="fig-note" x="12" y="173">4 of 50 were mistakes</text>
