<svg class="fig" viewBox="0 0 360 180" role="img" aria-labelledby="fig-mission-title fig-mission-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-mission-title">The costs come now, for certain, and the vision someday, maybe.</title>
  <desc id="fig-mission-desc">On the left, three costs, solid because they are paid now and for certain: a skipped test, a hidden result, a user who gets hurt. On the right, one large circle with a dotted outline, the vision, which may come someday. An arrow from the costs, marked "for the mission," runs toward the vision and stops at a heavy line between them. The line is highlighted: your line, drawn before anyone asks.</desc>

  <text class="fig-label" x="12" y="28">Now, for certain</text>
  <g class="fig-ink">
    <circle cx="18" cy="58" r="5.5"/>
    <circle cx="18" cy="88" r="5.5"/>
    <circle cx="18" cy="118" r="5.5"/>
  </g>
  <text class="fig-item" x="32" y="62.5">A skipped test</text>
  <text class="fig-item" x="32" y="92.5">A hidden result</text>
  <text class="fig-item" x="32" y="122.5">A user who gets hurt</text>

  <path class="fig-axis" d="M140,88 L198,88"/>
  <path class="fig-arrow-ink" d="M198,83 L207,88 L198,93 Z"/>
  <text class="fig-note" x="204" y="78" text-anchor="end">for the mission</text>

  <rect class="fig-mark" x="180" y="15" width="68" height="18"/>
  <text class="fig-label fig-on-mark" x="214" y="28" text-anchor="middle">Your line</text>
  <path class="fig-line" d="M214,42 L214,146"/>
  <text class="fig-note" x="214" y="168" text-anchor="middle">drawn before anyone asks</text>

  <circle class="fig-return" cx="290" cy="88" r="54"/>
  <text class="fig-label" x="290" y="86" text-anchor="middle">The vision</text>
  <text class="fig-note" x="290" y="101" text-anchor="middle">someday, maybe</text>
</svg>
