<svg class="fig" viewBox="0 0 360 240" role="img" aria-labelledby="fig-small-title fig-small-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-small-title">Twelve groups of 5, of 50 and of 500 people: the small groups land far from the real rate.</title>
  <desc id="fig-small-desc">Three rows of dots on one scale, from nobody saying yes to everybody. Each dot is one group that was asked, and in the whole crowd half would say yes. In the first row each group is 5 people, and the twelve answers scatter from 1 in 5 to 4 in 5. Two groups sit at 4 in 5, and a highlighted label points at them: 4 of 5 said yes, which looks like 80 percent. In the second row each group is 50 people, and the answers run from about 4 in 10 to 6 in 10. In the third row each group is 500, and all twelve sit close to half.</desc>
  <!-- One random draw, not a tidy average: Python's random.Random(1971), twelve groups of each size at a real rate of one half; groups of 50 are gathered into piles 6 points wide and groups of 500 into piles 4 points wide, each centred on one half. -->

  <text class="fig-label" x="12" y="18">Each dot</text>
  <text class="fig-note" x="12" y="33">one group asked</text>
  <text class="fig-label" x="232.0" y="18" text-anchor="middle">The real rate: half say yes</text>
  <path class="fig-guide" d="M232,26 L232,216"/>
  <rect class="fig-mark" x="251.6" y="29" width="96.4" height="18"/>
  <path class="fig-guide" d="M294.4,50 L294.4,69.5"/>
  <text class="fig-label fig-on-mark" x="344" y="42" text-anchor="end">4 of 5 said yes</text>
  <text class="fig-note" x="294.4" y="107" text-anchor="middle">looks like 80%</text>
  <text class="fig-label" x="12" y="86">Groups of 5</text>
  <path class="fig-axis" d="M128,90 L336,90"/>
  <g class="fig-ink">
    <circle cx="169.6" cy="85.2" r="4"/><circle cx="169.6" cy="76.6" r="4"/><circle cx="169.6" cy="68" r="4"/><circle cx="169.6" cy="59.4" r="4"/><circle cx="211.2" cy="85.2" r="4"/><circle cx="211.2" cy="76.6" r="4"/><circle cx="252.8" cy="85.2" r="4"/><circle cx="252.8" cy="76.6" r="4"/><circle cx="252.8" cy="68" r="4"/><circle cx="252.8" cy="59.4" r="4"/><circle cx="294.4" cy="85.2" r="4"/><circle cx="294.4" cy="76.6" r="4"/>
  </g>
  <text class="fig-label" x="12" y="140">Groups of 50</text>
  <path class="fig-axis" d="M128,144 L336,144"/>
  <g class="fig-ink">
    <circle cx="207.0" cy="139.2" r="4"/><circle cx="219.5" cy="139.2" r="4"/><circle cx="219.5" cy="130.6" r="4"/><circle cx="219.5" cy="122" r="4"/><circle cx="219.5" cy="113.4" r="4"/><circle cx="232.0" cy="139.2" r="4"/><circle cx="232.0" cy="130.6" r="4"/><circle cx="232.0" cy="122" r="4"/><circle cx="232.0" cy="113.4" r="4"/><circle cx="232.0" cy="104.8" r="4"/><circle cx="244.5" cy="139.2" r="4"/><circle cx="257.0" cy="139.2" r="4"/>
  </g>
  <text class="fig-label" x="12" y="212">Groups of 500</text>
  <path class="fig-axis" d="M128,216 L336,216"/>
  <g class="fig-ink">
    <circle cx="223.7" cy="211.2" r="4"/><circle cx="223.7" cy="202.6" r="4"/><circle cx="223.7" cy="194" r="4"/><circle cx="223.7" cy="185.4" r="4"/><circle cx="232.0" cy="211.2" r="4"/><circle cx="232.0" cy="202.6" r="4"/><circle cx="232.0" cy="194" r="4"/><circle cx="232.0" cy="185.4" r="4"/><circle cx="232.0" cy="176.8" r="4"/><circle cx="232.0" cy="168.2" r="4"/><circle cx="232.0" cy="159.6" r="4"/><circle cx="240.3" cy="211.2" r="4"/>
  </g>
  <text class="fig-note" x="128" y="234" text-anchor="middle">None</text>
  <text class="fig-note" x="232.0" y="234" text-anchor="middle">Half said yes</text>
  <text class="fig-note" x="336" y="234" text-anchor="middle">All</text>
</svg>
