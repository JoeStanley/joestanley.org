<svg class="fig" viewBox="0 0 360 212" role="img" aria-labelledby="fig-access-title fig-access-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-access-title">Five questions reach one body of data, each needing its answer at a different freshness.</title>
  <desc id="fig-access-desc">On an insurance claims product, five questions run to the same data. "Is my claim paid?" needs its answer now, on the heaviest line. "Which claims are mine today?" needs it within a minute, "Is this bill a duplicate?" within the hour, "What did we pay this week?" by tomorrow, and "Is fraud rising this year?" within the month, on the lightest line. The fresher the answer, the more it costs to keep.</desc>

  <text class="fig-label" x="12" y="18">The questions</text>
  <text class="fig-label" x="226" y="18" text-anchor="middle">How fresh</text>

  <rect class="fig-pipe" x="286" y="30" width="62" height="156" rx="8"/>
  <text class="fig-label" x="317" y="104" text-anchor="middle">The</text>
  <text class="fig-label" x="317" y="118" text-anchor="middle">data</text>

  <rect class="fig-mark" x="209" y="26" width="34" height="15"/>
  <text class="fig-note" x="12" y="48">Is my claim paid?</text>
  <text class="fig-label" x="226" y="37" text-anchor="middle">Now</text>
  <path class="fig-line" d="M168,44 L284,44"/>

  <text class="fig-note" x="12" y="82">Which claims are mine today?</text>
  <text class="fig-label" x="226" y="71" text-anchor="middle">Within a minute</text>
  <path class="fig-line" d="M168,78 L284,78"/>

  <text class="fig-note" x="12" y="116">Is this bill a duplicate?</text>
  <text class="fig-label" x="226" y="105" text-anchor="middle">Within the hour</text>
  <path class="fig-axis" d="M168,112 L284,112"/>

  <text class="fig-note" x="12" y="150">What did we pay this week?</text>
  <text class="fig-label" x="226" y="139" text-anchor="middle">By tomorrow</text>
  <path class="fig-axis" d="M168,146 L284,146"/>

  <text class="fig-note" x="12" y="184">Is fraud rising this year?</text>
  <text class="fig-label" x="226" y="173" text-anchor="middle">Within the month</text>
  <path class="fig-return" d="M168,180 L284,180"/>

  <text class="fig-note" x="348" y="206" text-anchor="end">The heavier the line, the more it costs to keep fresh</text>
</svg>
