<svg class="fig" viewBox="0 0 360 192" role="img" aria-labelledby="fig-champ-title fig-champ-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-champ-title">A flag on a hill, and a path drawn back from it to where the team stands.</title>
  <desc id="fig-champ-desc">The vision is a flag at the top of a hill. A dotted path runs back from the flag to a small group at the foot of the hill, where the team stands: name the destination first, then work back to what would have to be true to get there.</desc>

  <path class="fig-axis" d="M14.0,168.6 C120.0,168.6 200.0,129.0 250.0,82.6 C272.0,61.9 290.0,53.3 306.0,53.3 C322.0,53.3 336.0,58.5 346.0,65.4"/>
  <path class="fig-axis" d="M306.0,53.3 L306.0,13.8"/>
  <path class="fig-mark" d="M306.0,13.8 L338.0,21.5 L306.0,29.2 Z"/>
  <text class="fig-label" x="298" y="22.4" text-anchor="end">The vision</text>

  <path class="fig-return" d="M296.0,39.6 C230.0,34.4 150.0,77.4 81.0,136.7"/>
  <path class="fig-arrow" d="M74.0,142.8 L84.6,139.8 L77.5,133.6 Z"/>
  <text class="fig-note" x="128" y="58.5" text-anchor="middle">Work back from it</text>

  <g class="fig-ink">
    <circle cx="38" cy="158.2" r="6"/><circle cx="54" cy="155.7" r="6"/><circle cx="70" cy="158.2" r="6"/>
  </g>
  <text class="fig-note" x="22" y="182.3">Where the team stands</text>
</svg>
