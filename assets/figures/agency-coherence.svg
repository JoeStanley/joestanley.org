  <path class="fig-axis" d="M36,90 C65,98 100,84 135,92 S168,96 178,96 L202,96 C222,96 258,94 288,94"/>
  <path class="fig-axis" d="M36,110 C70,102 100,118 135,108 S168,104 178,104 L202,104 C222,104 258,108 288,108"/>
  <path class="fig-axis" d="M36,130 C65,138 105,122 138,128 S168,112 178,112 L202,112 C222,112 258,126 288,126"/>
  <path class="fig-arrow-ink" d="M288,71 L297,76 L288,81 Z"/>
  <path class="fig-arrow-ink" d="M288,89 L297,94 L288,99 Z"/>
  <path class="fig-arrow-ink" d="M288,103 L297,108 L288,113 Z"/>
  <path class="fig-arrow-ink" d="M288,121 L297,126 L288,131 Z"/>

  <text class="fig-label" x="140" y="46" text-anchor="middle">One direction everyone holds to</text>
  <path class="fig-axis" d="M190,122 L190,172"/>
  <text class="fig-label" x="190" y="188" text-anchor="middle">The few things that have to fit</text>
  <text class="fig-note" x="190" y="203" text-anchor="middle">everything else is each team's call</text>
</svg>
