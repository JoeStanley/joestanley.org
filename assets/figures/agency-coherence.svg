<svg class="fig" viewBox="0 0 360 212" role="img" aria-labelledby="fig-agency-title fig-agency-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-agency-title">Teams on paths of their own, inside one direction.</title>
  <desc id="fig-agency-desc">One large arrow, the direction everyone holds to. Inside it four paths wander, each its own way and all toward the same end. At one highlighted stretch they run straight, side by side and evenly spaced: the few things that have to fit. Everything else is each team's call.</desc>

