<svg class="fig" viewBox="0 0 360 212" role="img" aria-labelledby="fig-agency-title fig-agency-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-agency-title">Teams on paths of their own, inside one direction.</title>
  <desc id="fig-agency-desc">A broad arrow points to the right. Inside it, four small arrows wander on paths of their own. All four squeeze through one small highlighted gate, the few things that have to fit, then spread out again, and all end pointing the way the broad arrow points.</desc>

  <path class="fig-pipe" d="M18,58 L262,58 L262,32 L346,100 L262,168 L262,142 L18,142 Z"/>
  <rect class="fig-mark" x="183" y="88" width="14" height="24"/>

  <path class="fig-axis" d="M36,72 C80,62 120,88 150,84 S180,93 190,94 S235,66 288,80"/>
  <path class="fig-axis" d="M36,94 C60,110 95,80 125,96 S175,99 190,99 S240,110 288,95"/>
  <path class="fig-axis" d="M36,112 C65,100 95,126 128,112 S175,103 190,103 S240,92 288,110"/>
  <path class="fig-axis" d="M36,128 C70,136 110,118 140,124 S180,108 190,107 S235,134 288,124"/>
  <path class="fig-arrow" d="M286,75 L295,80 L286,85 Z"/>
  <path class="fig-arrow" d="M286,90 L295,95 L286,100 Z"/>
  <path class="fig-arrow" d="M286,105 L295,110 L286,115 Z"/>
  <path class="fig-arrow" d="M286,119 L295,124 L286,129 Z"/>

  <text class="fig-label" x="140" y="46" text-anchor="middle">One direction everyone holds to</text>
  <path class="fig-axis" d="M190,116 L190,172"/>
  <text class="fig-label" x="190" y="188" text-anchor="middle">The few things that have to fit</text>
  <text class="fig-note" x="190" y="204" text-anchor="middle">Everything else is each team's call</text>
</svg>
