<svg class="fig" viewBox="0 0 360 206" role="img" aria-labelledby="fig-promise-title fig-promise-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-promise-title">Callers build on what an API documents and on what it happens to do.</title>
  <desc id="fig-promise-desc">A weather API documents two things, temperature in degrees Celsius and rain in millimeters, and all three of its callers, an airline, a delivery firm and a farm app, use them, on solid lines. It also does two things nobody promised: it returns readings in order, and it gives dates in UTC. Dotted lines show that the farm app counts on both. The order is marked: change it, and the farm app breaks.</desc>

  <text class="fig-label" x="87" y="18" text-anchor="middle">The API</text>
  <text class="fig-label" x="294" y="18" text-anchor="middle">Its callers</text>

  <rect class="fig-pipe" x="12" y="30" width="150" height="144" rx="6"/>
  <text class="fig-label" x="24" y="52">Documented</text>
  <text class="fig-item" x="24" y="70">Temperature, in °C</text>
  <text class="fig-item" x="24" y="86">Rain, in mm</text>

  <path class="fig-guide" d="M22,102 L152,102"/>
  <text class="fig-label" x="24" y="122">Never promised</text>
  <rect class="fig-mark" x="20" y="127" width="116.1" height="18"/>
  <text class="fig-label fig-on-mark" x="24" y="140">Readings in order</text>
  <text class="fig-item" x="24" y="158">Dates in UTC</text>

  <path class="fig-axis" d="M162,78 L240,54"/>
  <path class="fig-axis" d="M162,78 L240,104"/>
  <path class="fig-axis" d="M162,78 L240,147"/>
  <path class="fig-return" d="M162,137 L240,154"/>
  <path class="fig-return" d="M162,156 L240,161"/>

  <rect class="fig-pipe" x="240" y="40" width="108" height="28" rx="6"/>
  <rect class="fig-pipe" x="240" y="90" width="108" height="28" rx="6"/>
  <rect class="fig-pipe" x="240" y="140" width="108" height="28" rx="6"/>
  <text class="fig-label" x="294" y="58.5" text-anchor="middle">Airline</text>
  <text class="fig-label" x="294" y="108.5" text-anchor="middle">Delivery firm</text>
  <text class="fig-label" x="294" y="158.5" text-anchor="middle">Farm app</text>

  <text class="fig-note" x="12" y="198">Change the order, and the farm app breaks</text>
</svg>
