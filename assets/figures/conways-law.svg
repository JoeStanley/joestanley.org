<svg class="fig" viewBox="0 0 360 200" role="img" aria-labelledby="fig-conway-title fig-conway-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-conway-title">Two teams, and the system they built split along the same line.</title>
  <desc id="fig-conway-desc">Two teams sit apart, with a line between them. Below them, the system they built is in two parts, divided along the same line, and the join between the parts is where they meet.</desc>

  <text class="fig-label" x="100" y="22" text-anchor="middle">One team</text>
  <text class="fig-label" x="260" y="22" text-anchor="middle">Another team</text>
  <g class="fig-ink">
    <circle cx="84" cy="48" r="6"/><circle cx="100" cy="44" r="6"/><circle cx="116" cy="48" r="6"/>
    <circle cx="244" cy="48" r="6"/><circle cx="260" cy="44" r="6"/><circle cx="276" cy="48" r="6"/>
  </g>

  <rect class="fig-mark" x="171" y="86" width="18" height="76"/>
  <rect class="fig-pipe" x="36" y="92" width="134" height="64" rx="8"/>
  <rect class="fig-pipe" x="190" y="92" width="134" height="64" rx="8"/>
  <path class="fig-axis" d="M170,124 L190,124"/>
  <path class="fig-return" d="M180,10 L180,172"/>

  <text class="fig-note" x="103" y="128" text-anchor="middle">Their part</text>
  <text class="fig-note" x="257" y="128" text-anchor="middle">Their part</text>
  <text class="fig-note" x="180" y="190" text-anchor="middle">The seam, where the parts meet</text>
</svg>
