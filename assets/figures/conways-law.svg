<svg class="fig" viewBox="0 0 360 198" role="img" aria-labelledby="fig-conway-title fig-conway-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-conway-title">Three teams and the product they build, in the same shape.</title>
  <desc id="fig-conway-desc">The same drawing twice, with an arrow from the first to the second. On the left, who talks to whom: three teams, Flights, Bags and Payments. Flights talks to Payments and Bags talks to Payments. Between Flights and Bags there is a gap: they rarely talk. On the right, what they build: three parts of the product, Flights, Bags and Payments, joined the same way, with the same gap between Flights and Bags. That gap is highlighted: the seam. A customer books a flight, then starts over to add a bag.</desc>

  <text class="fig-label" x="12" y="18">Who talks to whom</text>
  <text class="fig-note" x="88" y="46" text-anchor="middle">Rarely talk</text>
  <path class="fig-axis" d="M44,84 L78,126 M132,84 L98,126"/>
  <rect class="fig-pipe" x="12" y="56" width="64" height="28" rx="6"/>
  <rect class="fig-pipe" x="100" y="56" width="64" height="28" rx="6"/>
  <rect class="fig-pipe" x="48" y="126" width="80" height="28" rx="6"/>
  <text class="fig-label" x="44" y="74.5" text-anchor="middle">Flights</text>
  <text class="fig-label" x="132" y="74.5" text-anchor="middle">Bags</text>
  <text class="fig-label" x="88" y="144.5" text-anchor="middle">Payments</text>

  <path class="fig-axis" d="M169,105 L182,105"/>
  <path class="fig-arrow-ink" d="M182,100 L191,105 L182,110 Z"/>

  <text class="fig-label" x="196" y="18">What they build</text>
  <text class="fig-label" x="272" y="46" text-anchor="middle">The seam</text>
  <rect class="fig-mark" x="266" y="56" width="12" height="28"/>
  <path class="fig-axis" d="M228,84 L262,126 M316,84 L282,126"/>
  <rect class="fig-pipe" x="196" y="56" width="64" height="28" rx="6"/>
  <rect class="fig-pipe" x="284" y="56" width="64" height="28" rx="6"/>
  <rect class="fig-pipe" x="232" y="126" width="80" height="28" rx="6"/>
  <text class="fig-label" x="228" y="74.5" text-anchor="middle">Flights</text>
  <text class="fig-label" x="316" y="74.5" text-anchor="middle">Bags</text>
  <text class="fig-label" x="272" y="144.5" text-anchor="middle">Payments</text>

  <text class="fig-note" x="12" y="188">Book a flight, then start over to add a bag</text>
</svg>
