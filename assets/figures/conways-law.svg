<svg class="fig" viewBox="0 0 360 200" role="img" aria-labelledby="fig-conway-title fig-conway-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-conway-title">Three teams and the product they build, in the same shape.</title>
  <desc id="fig-conway-desc">Two halves with the same shape. On the left, who talks to whom: three teams, Flights, Bags and Payments. Flights talks to Payments and Bags talks to Payments, and Flights and Bags rarely talk. On the right, what they build: three parts of the product, Flights, Bags and Payments, joined the same way. Where the two teams rarely talk, the product has a gap, highlighted: the seam. A customer books a flight, then starts over to add a bag.</desc>

  <text class="fig-label" x="12" y="18">Who talks to whom</text>
  <path class="fig-axis" d="M40,64 L90,134 L140,64"/>
  <g class="fig-ink">
    <circle cx="40" cy="64" r="5.5"/>
    <circle cx="140" cy="64" r="5.5"/>
    <circle cx="90" cy="134" r="5.5"/>
  </g>
  <text class="fig-label" x="40" y="50" text-anchor="middle">Flights</text>
  <text class="fig-label" x="140" y="50" text-anchor="middle">Bags</text>
  <text class="fig-label" x="90" y="158" text-anchor="middle">Payments</text>
  <text class="fig-note" x="90" y="68.5" text-anchor="middle">rarely talk</text>

  <text class="fig-label" x="196" y="18">What they build</text>
  <path class="fig-axis" d="M230,78 L262,120 M314,78 L282,120"/>
  <rect class="fig-mark" x="265" y="50" width="14" height="28"/>
  <rect class="fig-pipe" x="196" y="50" width="68" height="28" rx="6"/>
  <rect class="fig-pipe" x="280" y="50" width="68" height="28" rx="6"/>
  <rect class="fig-pipe" x="232" y="120" width="80" height="28" rx="6"/>
  <text class="fig-label" x="230" y="68.5" text-anchor="middle">Flights</text>
  <text class="fig-label" x="314" y="68.5" text-anchor="middle">Bags</text>
  <text class="fig-label" x="272" y="138.5" text-anchor="middle">Payments</text>
  <text class="fig-label" x="272" y="40" text-anchor="middle">The seam</text>

  <text class="fig-note" x="12" y="190">Book a flight, then start over to add a bag</text>
</svg>
