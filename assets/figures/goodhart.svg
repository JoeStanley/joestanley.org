<svg class="fig" viewBox="0 0 360 212" role="img" aria-labelledby="fig-good-title fig-good-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-good-title">A number and the thing it measured, before and after the number becomes a target.</title>
  <desc id="fig-good-desc">Two lines over time. At first the number and what you wanted move together. After the number becomes a target, the number climbs steeply while what you wanted stays flat and then slips.</desc>

  <g transform="translate(0,-6)">

  <rect class="fig-mark" x="143" y="34" width="14" height="158"/>
  <path class="fig-axis" d="M12,30 L12,192 L348,192"/>
  <text class="fig-label" x="150" y="24" text-anchor="middle">Becomes a target</text>

  <path class="fig-wanted" d="M12,152 C64,150 104,147 150,144 C210,146 280,154 340,168"/>
  <path class="fig-line" d="M12,142 C64,140 104,137 150,134 C205,122 270,76 340,50"/>

  <text class="fig-label" x="338" y="40" text-anchor="end">The number</text>
  <text class="fig-label" x="338" y="184" text-anchor="end">What you wanted</text>
  <text class="fig-note" x="80" y="122" text-anchor="middle">Moving together</text>
  <text class="fig-note" x="348" y="210" text-anchor="end">Time</text>
  </g>
</svg>
